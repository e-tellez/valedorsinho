<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Payload Validator – Valedorsinho</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/payload_validator.css') }}" />
</head>
<body>
<div class="validator-container">

  <a href="{{ url_for('homepage.dashboard') }}" class="btn-back">&larr; Back to Dashboard</a>

  <h1>Payment Payload Validator</h1>
  <p class="validator-subtitle">Paste a <code>/payments</code> JSON payload and validate it against the Adyen OpenAPI spec.</p>

  <!-- Input area -->
  <div class="editor-wrap">
    <textarea id="payload-input" spellcheck="false" placeholder='{
  "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
  "reference": "order-123",
  "amount": { "value": 1000, "currency": "EUR" },
  "paymentMethod": { "type": "scheme", "number": "..." },
  "returnUrl": "https://your-domain.com/redirect"
}'></textarea>
  </div>

  <!-- Actions -->
  <div class="actions-row">
    <button id="btn-validate" class="btn-primary">Validate</button>
    <button id="btn-export-csv" class="btn-secondary" disabled>Export CSV</button>
  </div>

  <!-- Status banner -->
  <div id="status-banner" class="status-banner hidden"></div>

  <!-- Error table -->
  <div id="errors-section" class="errors-section hidden">
    <h2>Validation Errors</h2>
    <table class="errors-table">
      <thead>
        <tr>
          <th>Field</th>
          <th>Error</th>
          <th>Rule</th>
        </tr>
      </thead>
      <tbody id="errors-body"></tbody>
    </table>
  </div>

</div>

<script src="{{ url_for('static', filename='js/payload_validator.js') }}"></script>
</body>
</html>
