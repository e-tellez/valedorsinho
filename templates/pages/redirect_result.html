{% extends "base.html" %}

{% block title %}Redirecting…{% endblock %}

{% block body %}
<!--
  Tiny intermediate page rendered by handle_shopper_redirect.
  Stores the full Adyen response in sessionStorage (same mechanism the JS
  flow uses) and then navigates to the result page.
-->
<script>
  try {
    sessionStorage.setItem("adyen_result", {{ adyen_response_json | tojson }});
  } catch (e) {}
  window.location.href = {{ redirect_url | tojson }};
</script>
{% endblock %}
