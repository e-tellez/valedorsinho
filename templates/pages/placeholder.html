{% extends "base.html" %}

{% block title %}{{ title }} – Valedorsinho{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}" />
  <style>
    .placeholder-container {
      width: 100%;
      max-width: 540px;
    }
    .placeholder-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
    }
    .placeholder-box h2 {
      font-size: 1.2rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .placeholder-box p {
      font-size: 0.9rem;
      color: #666;
    }
  </style>
{% endblock %}

{% block body %}
<div class="placeholder-container">
  <a href="{{ url_for('homepage.dashboard') }}" class="btn-back">&larr; Back to Dashboard</a>
  <div class="placeholder-box">
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>
</div>
{% endblock %}
