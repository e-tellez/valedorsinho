<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Fleet Manager – Valedorsinho</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/terminal_fleet.css') }}" />
</head>
<body>
<div class="fleet-container">

  <a href="{{ url_for('homepage.dashboard') }}" class="btn-back">&larr; Back to Dashboard</a>

  <h1>Terminal Fleet Manager</h1>
  <p class="fleet-subtitle">View your terminal inventory and where each device is assigned.</p>

  <!-- Search / filter bar -->
  <div class="fleet-toolbar">
    <input
      type="text"
      id="search-input"
      class="fleet-search"
      placeholder="Search by serial number or terminal ID…"
      spellcheck="false"
      autocomplete="off"
    />
    <button id="btn-refresh" class="btn-secondary btn-sm">Refresh</button>
  </div>

  <!-- Reassign action bar (visible when terminals are selected) -->
  <div id="reassign-bar" class="reassign-bar hidden">
    <span id="reassign-count" class="reassign-count">0 selected</span>
    <select id="reassign-store" class="reassign-store" disabled>
      <option value="">Select target store…</option>
    </select>
    <button id="btn-reassign" class="btn-primary btn-sm" disabled>Reassign</button>
    <button id="btn-deselect" class="btn-secondary btn-sm">Deselect All</button>
  </div>

  <!-- Status banner for errors / info -->
  <div id="fleet-status" class="fleet-status hidden"></div>

  <!-- Terminal table -->
  <div class="fleet-table-wrap">
    <table class="fleet-table" id="fleet-table">
      <thead>
        <tr>
          <th class="col-checkbox"><input type="checkbox" id="select-all" title="Select all" /></th>
          <th>Terminal ID</th>
          <th>Model</th>
          <th>Serial Number</th>
          <th>Status</th>
          <th>Store</th>
          <th>Merchant</th>
          <th>Last Activity</th>
        </tr>
      </thead>
      <tbody id="fleet-tbody">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>

  <!-- Empty state -->
  <p id="fleet-empty" class="fleet-empty hidden">No terminals found.</p>

  <!-- Loading spinner -->
  <div id="fleet-loading" class="fleet-loading">
    <div class="spinner"></div>
    <span>Loading terminals…</span>
  </div>

  <!-- Pagination -->
  <div id="fleet-pagination" class="fleet-pagination hidden">
    <button id="btn-prev" class="btn-secondary btn-sm" disabled>&laquo; Previous</button>
    <span id="page-info" class="page-info"></span>
    <button id="btn-next" class="btn-secondary btn-sm" disabled>Next &raquo;</button>
  </div>

</div>

<script>
  const FLEET_CONFIG = {
    merchantAccount: "{{ merchant_account }}",
  };
</script>
<script src="{{ url_for('static', filename='js/terminal_fleet.js') }}"></script>
</body>
</html>
