<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payload Suggested – Valedorsinho</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/payload_suggested.css') }}" />
</head>
<body>
<div class="suggested-container">

  <a href="{{ url_for('homepage.dashboard') }}" class="btn-back">&larr; Back to Dashboard</a>

  <h1>Payload Suggested</h1>
  <p class="suggested-subtitle">Select a merchant vertical to generate a recommended <code>/payments</code> payload.</p>

  <!-- Vertical checkboxes -->
  <div class="verticals-grid">
    {% for vertical in verticals %}
    <label class="vertical-option">
      <input type="radio" name="vertical" value="{{ vertical.key }}"
             data-payload='{{ vertical.payload | tojson }}'
             {% if loop.first %}checked{% endif %} />
      <div class="vertical-pill">
        <span class="vertical-label">{{ vertical.label }}</span>
        <span class="vertical-desc">{{ vertical.description }}</span>
      </div>
    </label>
    {% endfor %}
  </div>

  <!-- Actions -->
  <div class="actions-row">
    <button id="btn-copy" class="btn-primary">Copy to Clipboard</button>
    <button id="btn-download" class="btn-secondary">Download .json</button>
  </div>

  <!-- Copied banner -->
  <div id="copy-banner" class="copy-banner hidden">Copied to clipboard!</div>

  <!-- Preview -->
  <div class="preview-wrap">
    <pre id="payload-preview" class="payload-preview"></pre>
  </div>

</div>

<script src="{{ url_for('static', filename='js/payload_suggested.js') }}"></script>
</body>
</html>
