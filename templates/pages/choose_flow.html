<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout – Step 1 of 4</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}" />
</head>
<body>
<div class="checkout-container">

  <!-- Step indicator -->
  <div class="step-indicator">
    <span class="step active">1</span>
    <span class="step-line"></span>
    <span class="step">2</span>
    <span class="step-line"></span>
    <span class="step">3</span>
    <span class="step-line"></span>
    <span class="step">4</span>
  </div>

  <h1>How would you like to pay?</h1>
  <p class="step-subtitle">Choose a checkout experience to get started.</p>

  <div class="flow-choices">
    <a href="{{ url_for('pages.order', flow='guest') }}" class="flow-card">
      <svg class="flow-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="16" r="8" stroke="currentColor" stroke-width="2.5"/>
        <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="flow-title">Guest</span>
      <span class="flow-desc">Pay without creating an account. Quick and simple.</span>
    </a>

    <a href="{{ url_for('pages.order', flow='account') }}" class="flow-card">
      <svg class="flow-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="16" r="8" stroke="currentColor" stroke-width="2.5"/>
        <path d="M4 42c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="38" cy="32" r="8" fill="#e8f0fe" stroke="currentColor" stroke-width="2"/>
        <path d="M35 32l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="flow-title">Account</span>
      <span class="flow-desc">Sign in to save cards and speed up future payments.</span>
    </a>
  </div>

</div>
</body>
</html>
